---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: busybox-pvc-rbd2
  labels:
    appname: busybox
    placement: busybox-placement-1
    dr-protected-enabled: "true"        
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ocs-storagecluster-ceph-rbd
  resources:
    requests:
      storage: 5Gi
