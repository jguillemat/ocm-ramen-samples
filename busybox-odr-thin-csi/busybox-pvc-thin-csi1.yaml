---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: busybox-pvc-thin-csi1
  labels:
    appname: busybox
    instance: busybox-pvc-thin-csi1
    dr-protected-enabled: "false"        
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: thin-csi
  resources:
    requests:
      storage: 5Gi
