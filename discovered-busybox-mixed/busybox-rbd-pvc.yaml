---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: busybox-pvc-rbd
  labels:
    appname: busybox
    instance: busybox-rbd
    placement: busybox-placement-1
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ocs-storagecluster-ceph-rbd
  resources:
    requests:
      storage: 5Gi
