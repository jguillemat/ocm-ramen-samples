---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: busybox-pvc-cephfs
  labels:
    appname: busybox
    instance: busybox-cephfs    
    placement: busybox-placement-1
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ocs-storagecluster-cephfs
  resources:
    requests:
      storage: 5Gi
