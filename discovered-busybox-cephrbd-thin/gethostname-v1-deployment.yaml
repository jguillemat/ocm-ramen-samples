---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gethostname-v1
    app.kubernetes.io/component: gethostname-v1
    app.kubernetes.io/instance: gethostname-v1
  name: gethostname-v1
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      deployment: gethostname-v1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        openshift.io/generated-by: OpenShiftNewApp
      creationTimestamp: null
      labels:
        deployment: gethostname-v1
    spec:
      containers:
      - name: gethostname-v1
        image: quay.io/rhdevelopers/gethostname:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
          - name: mypvc
            mountPath: /mnt/test        
      volumes:
        - name: mypvc
          persistentVolumeClaim:
            claimName: gethostname-pvc-rbd
